services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: network_monitor_db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  db-init:
    build:
      context: ./backend
    container_name: network_monitor_db_init
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "db/init.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME:-network_monitor}
      - DB_ADMIN_USER=${DB_ADMIN_USER:-sa}
      - DB_ADMIN_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - DB_APP_USER=${DB_APP_USER:-onoffdash_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}

  backend:
    build: 
      context: ./backend
    container_name: network_monitor_backend
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./keys/jwt_private.pem:/etc/ssl/certs/jwt_private.pem:ro
      - ./keys/jwt_public.pem:/etc/ssl/certs/jwt_public.pem:ro
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME:-network_monitor}
      - DB_APP_USER=${DB_APP_USER:-onoffdash_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
      - DB_USER=${DB_APP_USER:-onoffdash_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3001
      - PING_INTERVAL_SECONDS=${PING_INTERVAL_SECONDS:-60}
      - HEARTBEAT_TIMEOUT_SECONDS=${HEARTBEAT_TIMEOUT_SECONDS:-90}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_PRIVATE_KEY_PATH=${JWT_PRIVATE_KEY_PATH:-/etc/ssl/certs/jwt_private.pem}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH:-/etc/ssl/certs/jwt_public.pem}
      - AUTH_INTROSPECTION_SECRET=${AUTH_INTROSPECTION_SECRET}
      - ALLOW_LEGACY_AGENT_AUTH=${ALLOW_LEGACY_AGENT_AUTH:-false}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  pdf-service:
    build:
      context: ./services/pdf-service
    container_name: network_monitor_pdf
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keys/jwt_public.pem:/etc/ssl/certs/jwt_public.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_APP_USER:-onoffdash_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH:-/etc/ssl/certs/jwt_public.pem}
      - AUTH_INTROSPECTION_URL=${AUTH_INTROSPECTION_URL:-http://backend:3001/api/auth/introspect}
      - AUTH_INTROSPECTION_SECRET=${AUTH_INTROSPECTION_SECRET}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/pdf/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  file-service:
    build:
      context: ./services/file-service
    container_name: network_monitor_file
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keys/jwt_public.pem:/etc/ssl/certs/jwt_public.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - FILE_TOOLS_MAX_FILE_SIZE_MB=${FILE_TOOLS_MAX_FILE_SIZE_MB:-50}
      - FILE_TOOLS_TTL_MINUTES=${FILE_TOOLS_TTL_MINUTES:-60}
      - FILE_TOOLS_LOG_MODE=${FILE_TOOLS_LOG_MODE:-jsonl}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_APP_USER:-onoffdash_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH:-/etc/ssl/certs/jwt_public.pem}
      - AUTH_INTROSPECTION_URL=${AUTH_INTROSPECTION_URL:-http://backend:3001/api/auth/introspect}
      - AUTH_INTROSPECTION_SECRET=${AUTH_INTROSPECTION_SECRET}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/file-tools/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: network_monitor_frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      backend:
        condition: service_healthy
      pdf-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"

volumes:
  mssqldata:
