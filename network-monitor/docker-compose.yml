version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: network_monitor_db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: network_monitor_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=network_monitor
      - DB_USER=sa
      - DB_PASSWORD=StrongPassword123!
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3001
      - PING_INTERVAL_SECONDS=60
      - HEARTBEAT_TIMEOUT_SECONDS=90
      - RETENTION_DAYS=30
    # No need to expose port 3001 externally since Nginx handles it
    # ports:
    #   - "3001:3001"

  frontend:
    build:
      context: ./frontend
    container_name: network_monitor_frontend
    restart: always
    depends_on:
      - backend
    ports:
      # Sunucunun 10.0.80.113 IP'si üzerinden 80 portuyla yayın yapması için:
      - "10.0.80.113:80:80"

volumes:
  mssqldata:
