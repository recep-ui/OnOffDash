services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: network_monitor_db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: network_monitor_backend
    restart: always
    cap_add:
      - NET_RAW
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME}
      - DB_ADMIN_USER=${DB_ADMIN_USER:-sa}
      - DB_ADMIN_PASSWORD=${MSSQL_SA_PASSWORD}
      - DB_USER=${DB_APP_USER:-onoffdash_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3001
      - PING_INTERVAL_SECONDS=${PING_INTERVAL_SECONDS}
      - HEARTBEAT_TIMEOUT_SECONDS=${HEARTBEAT_TIMEOUT_SECONDS}
      - RETENTION_DAYS=${RETENTION_DAYS}
      - JWT_SECRET=${JWT_SECRET}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pdf-service:
    build:
      context: ./services/pdf-service
    container_name: network_monitor_pdf
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_APP_USER:-onoffdash_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/pdf/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  file-service:
    build:
      context: ./services/file-service
    container_name: network_monitor_file
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
      - FILE_TOOLS_MAX_FILE_SIZE_MB=${FILE_TOOLS_MAX_FILE_SIZE_MB:-50}
      - FILE_TOOLS_TTL_MINUTES=${FILE_TOOLS_TTL_MINUTES:-60}
      - FILE_TOOLS_LOG_MODE=${FILE_TOOLS_LOG_MODE:-jsonl}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_APP_USER:-onoffdash_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/file-tools/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: network_monitor_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      pdf-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"

volumes:
  mssqldata:
