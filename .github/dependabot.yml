version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/network-monitor/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
      - "security"

  - package-ecosystem: "npm"
    directory: "/network-monitor/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
      - "security"

  - package-ecosystem: "npm"
    directory: "/network-monitor/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "agent"
      - "security"

  - package-ecosystem: "pip"
    directory: "/network-monitor/services/pdf-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pdf-service"
      - "security"

  - package-ecosystem: "pip"
    directory: "/network-monitor/services/file-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "file-service"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
