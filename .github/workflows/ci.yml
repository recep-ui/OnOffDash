name: CI/CD Security & Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: network-monitor/backend/package-lock.json

      - name: Install Dependencies
        working-directory: network-monitor/backend
        run: npm ci

      - name: ESLint Verification
        working-directory: network-monitor/backend
        run: npm run lint

      - name: Dependency Vulnerability Audit (High/Critical Fail Policy)
        working-directory: network-monitor/backend
        run: npm audit --audit-level=high

      - name: Backend Startup & Router Import Smoke Test
        working-directory: network-monitor/backend
        env:
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-at-least-32-chars-long"
          AGENT_API_KEY: "ci-pipeline-test-agent-key-at-least-32-chars-long"
          NODE_ENV: test
        run: |
          node -e "require('./routes/printers')"
          node -e "require('./server')"
          node --test tests/startup_smoke.test.js

      - name: Run Backend Tests (Real Production Routes)
        working-directory: network-monitor/backend
        env:
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-at-least-32-chars-long"
          AGENT_API_KEY: "ci-pipeline-test-agent-key-at-least-32-chars-long"
          NODE_ENV: test
        run: npm test

  agent-quality:
    name: Windows Agent Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: network-monitor/agent/package-lock.json

      - name: Install Dependencies
        working-directory: network-monitor/agent
        run: npm ci

      - name: Dependency Vulnerability Audit (High/Critical Fail Policy)
        working-directory: network-monitor/agent
        run: npm audit --audit-level=high

      - name: Run Agent Unit & Security Tests
        working-directory: network-monitor/agent
        run: npm test

  frontend-quality:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: network-monitor/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: network-monitor/frontend
        run: npm ci

      - name: ESLint Static Analysis
        working-directory: network-monitor/frontend
        run: npm run lint

      - name: Dependency Vulnerability Audit (High/Critical Fail Policy)
        working-directory: network-monitor/frontend
        run: npm audit --audit-level=high

      - name: Run Frontend Vitest Component Tests
        working-directory: network-monitor/frontend
        run: npm test

      - name: Production Bundle Build Verification
        working-directory: network-monitor/frontend
        run: npm run build

  python-microservices-quality:
    name: Python Microservices Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: PDF Service Test & Audit (Isolated Environment)
        working-directory: network-monitor/services/pdf-service
        env:
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-at-least-32-chars-long"
        run: |
          python -m venv .venv-pdf
          . .venv-pdf/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt --desc
          python -m unittest discover -s tests -p "test_*.py"
          deactivate

      - name: File Service Test & Audit (Isolated Environment)
        working-directory: network-monitor/services/file-service
        env:
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-at-least-32-chars-long"
        run: |
          python -m venv .venv-file
          . .venv-file/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt --desc
          python -m unittest discover -s tests -p "test_*.py"
          deactivate

  security-secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-sast-codeql:
    name: Security SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          languages: javascript-typescript, python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          category: "/language:javascript-typescript,python"

  container-security-scan:
    name: Container Vulnerability Scanning (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Backend Image
        run: docker build -t onoffdash-backend:test ./network-monitor/backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (resolves setup-trivy v0.3.1)
        with:
          image-ref: 'onoffdash-backend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image
        run: docker build -t onoffdash-frontend:test ./network-monitor/frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (resolves setup-trivy v0.3.1)
        with:
          image-ref: 'onoffdash-frontend:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build PDF Service Image
        run: docker build -t onoffdash-pdf:test ./network-monitor/services/pdf-service

      - name: Scan PDF Service Image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (resolves setup-trivy v0.3.1)
        with:
          image-ref: 'onoffdash-pdf:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build File Service Image
        run: docker build -t onoffdash-file:test ./network-monitor/services/file-service

      - name: Scan File Service Image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # v0.36.0 (resolves setup-trivy v0.3.1)
        with:
          image-ref: 'onoffdash-file:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-validation:
    name: Docker Compose & Deployment Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [backend-quality, agent-quality, frontend-quality, python-microservices-quality]
    if: always() && !cancelled()
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Docker Compose Configuration
        working-directory: network-monitor
        env:
          HOST_PORT: 80
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "StrongPassword123!"
          DB_NAME: "network_monitor"
          DB_USER: "sa"
          DB_APP_USER: "onoffdash_app"
          DB_APP_PASSWORD: "AppUserStrongPassword123!"
          BOOTSTRAP_ADMIN_USERNAME: "admin"
          BOOTSTRAP_ADMIN_PASSWORD: "AdminStrongPassword123!"
          PING_INTERVAL_SECONDS: 60
          HEARTBEAT_TIMEOUT_SECONDS: 90
          RETENTION_DAYS: 30
          JWT_SECRET: "ci-pipeline-test-jwt-secret-key-at-least-32-chars-long"
          AGENT_API_KEY: "ci-pipeline-test-agent-key-at-least-32-chars-long"
          CORS_ORIGINS: "http://localhost:80,http://localhost:5173"
          AUTH_INTROSPECTION_SECRET: "ci-pipeline-introspection-secret-min-32-chars"
        run: docker compose config --quiet

      - name: Run Clean Docker Deployment Smoke Test
        run: ./network-monitor/scripts/test_clean_docker_install.sh

      - name: Enforce Prerequisite Quality Jobs Passed
        run: |
          echo "Verifying all prerequisite jobs succeeded..."
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.agent-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.python-microservices-quality.result }}" != "success" ]; then
            echo "ERROR: Docker deployment smoke test executed, but one or more prerequisite quality jobs failed:"
            echo "  backend-quality: ${{ needs.backend-quality.result }}"
            echo "  agent-quality: ${{ needs.agent-quality.result }}"
            echo "  frontend-quality: ${{ needs.frontend-quality.result }}"
            echo "  python-microservices-quality: ${{ needs.python-microservices-quality.result }}"
            exit 1
          fi
          echo "All prerequisite quality jobs passed."
